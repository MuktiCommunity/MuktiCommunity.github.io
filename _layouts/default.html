<!doctype html>
<html lang="{{site.active_lang}}" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="{{ '/assets/fonts/Raleway-Regular.ttf' | relative_url }}"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="{{ '/assets/fonts/Mulish-Regular.ttf' | relative_url }}"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      href="{{ '/assets/css/dist-style.css' | relative_url }}"
      rel="stylesheet"
    />
    <link
      href="{{ '/assets/css/fonts.css' | relative_url }}"
      rel="stylesheet"
    />
    {% if site.typewriter_effect and page.layout == 'home' %}
    <script src="https://unpkg.com/typeit@8.8.4/dist/index.umd.js"></script>
    {% endif %} {% seo %} {% include custom_head.html %}
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: true });
    </script>

  </head>

  <body class="text-gray-700 dark:bg-gray-700 dark:text-slate-100" style="background-color: #FDF1E1">
    {% if site.typewriter_effect and page.layout == 'home' %}
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const heroTitle = document.querySelector("#main h1");
        if (heroTitle) {
          new TypeIt(heroTitle, {}).go();
        }
      });
    </script>
    {% endif %} {% include navbar.html %}
    <br>
    {{ content }} {% include footer.html
    %}
    
    <script id="dsq-count-scr" src="//{{ site.disqus_shortname }}.disqus.com/count.js" async></script>
  </body>
</html>
