title: The Mukti Community
logo: /assets/images/logo.png
url: https://mukticommunity.github.io
baseurl: ""
disqus_shortname: mukti-2

##
# Typewritter configuration.
# Feel free to disable if you don't like it.
##
typewriter_effect: true

##
# Collections configuration
##
collections:
  projects:
    output: true

##
# Contact Channels configuration
##
contact_channels_section: true
contact_channels:
  email: mukti.community@gmail.com
  github: "https://github.com/MuktiCommunity"
  linkedin: "https://www.linkedin.com/company/mukticommunity/"
  discord: "https://discord.gg/8DAd4Ykz"
  telegram: "https://t.me/MuktiCommunity"
  instagram: "https://www.instagram.com/mukti_community"
  whatsapp: "https://chat.whatsapp.com/Efg270PnXlQL7oEZL0m1S9"

##
# Plugins configuration
##
plugins:
  - jekyll-archives
  - jekyll-last-modified-at
  - jekyll-seo-tag
  - jekyll-polyglot

##
# Polyglot configuration
##
languages: ["en"]
default_lang: "en"
exclude_from_localization: ["javascript", "images", "css", "public"]
parallel_localization: false

##
# Archives configuration
##
jekyll-archives:
  enabled:
    - categories
  layout: blog
  permalinks:
    category: "/category/:name/"

##
# Exclude list
##
exclude:
  - vendor
  - .bundle
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - README.md
